name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (Spring Boot + PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests (embedded PostgreSQL binaries, no Docker needed)
        run: mvn -B verify
      # logs need a GitHub sign-in; annotations are public, so the first failures are printed as annotations
      - name: Show test failures as annotations
        if: failure()
        run: |
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] || continue
            if grep -qE "FAILURE|ERROR" "$f"; then
              # the failing test, its message (often on the next lines) and the test's own line number
              msg=$(grep -A6 -E "<<< (FAILURE|ERROR)" "$f" | grep -vE "^\s+at (org|java|jdk|sun)\." | head -12 | tr '\n' ' ' | tr -s ' ' | cut -c1-900)
              echo "::error title=$(basename "$f" .txt)::$msg"
            fi
          done
          grep -h -m 5 -E "APPLICATION FAILED|Caused by|initdb|postgres" target/surefire-reports/*-output.txt 2>/dev/null | head -10 | while read -r l; do echo "::warning::${l:0:300}"; done || true

  web:
    name: Web build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://example-api.onrender.com

  mobile:
    name: Mobile analyze + tests (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  customer-app:
    name: HesabPro Kart analyze (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true
      - run: flutter pub get
      - run: flutter analyze

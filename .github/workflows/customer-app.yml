name: HesabPro Kart APK

# Builds the customers' bonus card app (customer_app/) and publishes it as the "kart-latest" pre-release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "customer_app/**"
      - ".github/workflows/customer-app.yml"

permissions:
  contents: write

concurrency:
  group: customer-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # The same release key as the store app (repo secrets); without it the APK is signed with a debug key.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    defaults:
      run:
        working-directory: customer_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Release signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=${ANDROID_KEY_ALIAS:-hesabpro}"
            echo "keyPassword=$ANDROID_KEYSTORE_PASSWORD"
          } > android/key.properties
      - run: flutter build apk --release --build-name=0.1.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=API_URL=https://borcdefderi.onrender.com
      - run: cp build/app/outputs/flutter-apk/app-release.apk HesabPro-Kart.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HesabPro-Kart-apk
          path: customer_app/HesabPro-Kart.apk
      - name: Publish to the kart-latest pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kart-latest
          name: HesabPro Kart v0.1.${{ github.run_number }}
          prerelease: true
          files: customer_app/HesabPro-Kart.apk
          body: "HesabPro Kart (müştəri tətbiqi) 0.1.${{ github.run_number }} — avtomatik yığılıb: ${{ github.ref_name }} @ ${{ github.sha }}"

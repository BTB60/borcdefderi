name: Mobile APK

# Builds the Android release APK and publishes it as the "mobile-latest" pre-release,
# so it can be downloaded without a local Flutter toolchain.
on:
  workflow_dispatch:
  push:
    branches: [main, feature/barcode-scan]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-apk.yml"

permissions:
  contents: write

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=API_URL=https://borcdefderi.onrender.com
      - run: cp build/app/outputs/flutter-apk/app-release.apk HesabPro.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HesabPro-apk
          path: mobile/HesabPro.apk
      - name: Publish to the mobile-latest pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: HesabPro APK (son versiya)
          prerelease: true
          files: mobile/HesabPro.apk
          body: "Avtomatik yığılıb: ${{ github.ref_name }} @ ${{ github.sha }}"

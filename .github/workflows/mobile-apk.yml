name: Mobile APK

# Builds the Android release APK and publishes it as the "mobile-latest" pre-release,
# so it can be downloaded without a local Flutter toolchain.
on:
  workflow_dispatch:
  push:
    branches: [main, feature/barcode-scan]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-apk.yml"

permissions:
  contents: write

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Fixed release key (repo secrets). Every APK is signed with the same key, so a new version installs over the
      # old one and nobody is logged out. Without the secrets the build falls back to a throw-away debug key.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Release signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=${ANDROID_KEY_ALIAS:-hesabpro}"
            echo "keyPassword=$ANDROID_KEYSTORE_PASSWORD"
          } > android/key.properties
      - name: Warn when no release key is set
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: echo "::warning::ANDROID_KEYSTORE_BASE64 secret is missing - the APK is signed with a temporary debug key and will not install over older versions"
      # every build gets a higher version (0.2.<run>), so a new APK installs over the old one and the site can show it
      - run: flutter build apk --release --build-name=0.2.${{ github.run_number }} --build-number=${{ github.run_number }} --dart-define=API_URL=https://borcdefderi.onrender.com
      - run: cp build/app/outputs/flutter-apk/app-release.apk HesabPro.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HesabPro-apk
          path: mobile/HesabPro.apk
      - name: Publish to the mobile-latest pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: HesabPro APK v0.2.${{ github.run_number }}
          prerelease: true
          files: mobile/HesabPro.apk
          body: "Versiya 0.2.${{ github.run_number }} — avtomatik yığılıb: ${{ github.ref_name }} @ ${{ github.sha }}"

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never

spring:
  application:
    name: borcdefteri-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/borcdefteri}
    username: ${DATABASE_USERNAME:borcdefteri}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  timezone: Asia/Baku
  jwt:
    # Must be provided via environment (JWT_SECRET, at least 32 characters). No default on purpose.
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  bootstrap:
    # Optional: creates the first SUPER_ADMIN on startup if none exists.
    super-admin-email: ${ADMIN_EMAIL:}
    super-admin-password: ${ADMIN_PASSWORD:}
    super-admin-name: ${ADMIN_NAME:Platforma Administratoru}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    max-bytes: 5242880
  rate-limit:
    auth-requests-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:20}
  subscription:
    reminder-days: 7

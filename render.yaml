# Render Blueprint: deploys the Spring Boot API from ./backend using its Dockerfile.
# The PostgreSQL database is NOT created here: use Neon (or any managed PostgreSQL) and
# enter its JDBC URL as DATABASE_URL in the Render dashboard. Secrets are marked sync: false.
services:
  - type: web
    name: borcdefteri-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    plan: starter
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false # jdbc:postgresql://<neon-host>/<db>?sslmode=require
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false # generate: openssl rand -base64 48 (min 32 chars)
      - key: ADMIN_EMAIL
        sync: false # first platform administrator
      - key: ADMIN_PASSWORD
        sync: false # min 12 chars; used once, to create the admin account
      - key: CORS_ALLOWED_ORIGINS
        sync: false # e.g. https://borcdefteri.vercel.app
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: JWT_EXPIRATION_MINUTES
        value: "720"
      - key: AUTH_RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: DB_POOL_SIZE
        value: "10"

# Render Blueprint: deploys the Spring Boot API from ./backend using its Dockerfile.
# The PostgreSQL database is NOT created here: use Neon and enter its JDBC URL as DATABASE_URL.
# Values marked "sync: false" are asked for in the Render dashboard and are never stored in Git.
services:
  - type: web
    name: borcdefteri-api
    runtime: docker
    # Same AWS region as the Neon database (us-east-2 = Ohio): every request makes several DB queries.
    region: ohio
    # "starter" stays awake. "free" also works but sleeps after 15 min idle (first request then takes ~1 min).
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      # Neon: use the DIRECT host (without "-pooler"); the app has its own connection pool and Flyway
      # needs a session connection. Example:
      # jdbc:postgresql://ep-xxxx.c-8.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      # Random 256-bit value generated by Render once. Changing it later signs everyone out and
      # invalidates receipt links that were already shared.
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false # first platform administrator (login name), created only if no admin exists yet
      - key: ADMIN_PASSWORD
        sync: false # at least 12 characters; used once, to create the admin account
      # Comma-separated; '*' patterns allowed, e.g.
      # https://borcdefderi.vercel.app,https://borcdefderi-*-btb60s-projects.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false # the Vercel web address, e.g. https://borcdefteri.vercel.app (comma-separated for several)
      - key: APP_WEB_URL
        sync: false # the same Vercel address — used in "Şifrəni unutdum" e-mail links
      # Optional SMTP for "Şifrəni unutdum" e-mails. Leave empty: users then recover through the admin.
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: JWT_EXPIRATION_MINUTES
        value: "720"
      - key: AUTH_RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: DB_POOL_SIZE
        value: "5"
